[project]
name = "strava-dashboard"
version = "1.0.0"
description = "Local Strava dashboard with activity grades, AI coach comments, segment records and route maps."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# MCP server and Strava client started as JonoCX/strava-mcp (Apache-2.0); dashboard by BrickyStudios
authors = [{ name = "BrickyStudios" }, { name = "Jonathan Carlton" }]
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "meteostat>=1.6.8",
    "pre-commit>=4.2.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 79

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
